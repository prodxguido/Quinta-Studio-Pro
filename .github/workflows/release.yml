name: Publicar versión de QUINTA

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Crear instalador y publicar release
        run: npm run release -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
