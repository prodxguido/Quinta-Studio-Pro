name: Publicar versión de QUINTA

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Crear instalador y publicar release
        run: npm run release -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Garantizar artefactos del actualizador
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath release -File | Where-Object {
            $_.Name -match '^QUINTA-Setup-.*\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml'
          }
          if (-not $files) { throw 'No se encontraron los artefactos de actualización en release/' }
          gh release upload $env:GITHUB_REF_NAME $files.FullName --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
